[PHP]
extension_dir=ext
extension=curl
extension=fileinfo
extension=intl
extension=mbstring
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip
expose_php=Off
display_errors=Off
log_errors=On
memory_limit=256M
upload_max_filesize=20M
post_max_size=24M
date.timezone=UTC

error_reporting=E_ALL

[opcache]
opcache.enable=0
opcache.enable_cli=0
opcache.jit=disable
