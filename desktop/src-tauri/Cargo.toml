[package]
name = "fluxo-jornada"
version = "0.1.2"
description = "Sua jornada de trabalho no computador"
authors = ["Fluxo"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
tauri-plugin-dialog = "2"
