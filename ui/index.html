<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#f5f7fb"><title>Tempozi — Seu trabalho, passo a passo</title><link rel="icon" href="/ui/favicon.svg"><script>
(() => {
  let theme = "light";
  try {
    if (localStorage.getItem("fluxo:theme") === "graphite") theme = "graphite";
  } catch {}
  document.documentElement.dataset.theme = theme;
  document.documentElement.style.colorScheme = theme === "graphite" ? "dark" : "light";
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "graphite" ? "#151719" : "#f5f7fb");
})();
</script></head><body><div id="app"></div><script type="module" src="/src/main.js"></script></body></html>
