<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar portais · Fluxo</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#e3eaff,transparent 60%),#f7f8fc;color:#34425c;font:15px/1.7 Inter,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}main{width:min(100%,620px);background:#fff;border:1px solid #e5eaf5;box-shadow:0 20px 70px #546db312;border-radius:22px;padding:38px}h1{font-size:29px;line-height:1.2;letter-spacing:-1px}p{color:#6e7b91}small{color:#8c98ad}.brand{color:#5978ed;font-size:23px;font-weight:750}.status{border:1px solid #e3e9f6;background:#f6f8ff;padding:15px;border-radius:12px;white-space:pre-line;margin:22px 0}.error{color:#aa4c58;background:#fff4f5;border-color:#f0d8dd}button,.button{font:inherit;font-weight:600;border:0;background:#5978ed;color:white;padding:12px 19px;border-radius:9px;cursor:pointer;display:inline-block;text-decoration:none;font-size:13px}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eef2fc;color:#5872c7}nav{display:flex;flex-wrap:wrap;gap:12px}a{color:#5978ed}textarea{width:100%;min-height:90px;border:1px solid #dfe5f0;border-radius:8px;padding:12px;font:11px monospace}details{margin-top:24px}li{color:#6e7b91}footer{margin-top:24px}</style>
<main><span class="brand">fluxo.</span><h1>Vamos trazer seus portais.</h1><p id="description">A recuperação mantém as posições, os textos e as conexões dos portais.</p><div id="status" class="status" role="status">Localizando seus portais...</div><nav id="actions"></nav><details id="details" hidden><summary>Ver cópia para recuperação</summary><textarea id="backup" readonly aria-label="Cópia dos portais"></textarea></details><footer><small>Recuperação local · os portais antigos são preservados no navegador.</small></footer></main>
<script>
const status=document.querySelector('#status'), actions=document.querySelector('#actions'), details=document.querySelector('#details'), backup=document.querySelector('#backup');
const loopback=['127.0.0.1','localhost','[::1]'].includes(location.hostname);
const coordinate=v=>Math.min(1000000,Math.max(0,Math.round(Number(v)||0)));
function normalize(list){if(!Array.isArray(list))return[];const seen=new Set();return list.filter(p=>p&&typeof p.id==='string'&&p.id.length<=100&&!seen.has(p.id)&&seen.add(p.id)).map(p=>({id:p.id,label:typeof p.label==='string'?p.label.slice(0,160):'',x:coordinate(p.x),y:coordinate(p.y),sources:Array.isArray(p.sources)?[...new Set(p.sources.filter(id=>Number.isInteger(id)&&id>0))]:[]}));}
function button(text,run,secondary=false){const b=document.createElement('button');b.textContent=text;if(secondary)b.className='secondary';b.onclick=run;actions.append(b);return b;}
function showBackup(data){backup.value=JSON.stringify(data,null,2);details.hidden=false;}
function failure(e){status.textContent=e.message||String(e);status.classList.add('error');}
function download(data){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='fluxo-portais-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function api(path,method='GET',body,token){const r=await fetch('/api'+path,{method,credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json',...(body?{'Content-Type':'application/json','X-CSRF-TOKEN':token}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw new Error(data.errors?Object.values(data.errors).flat().join(' '):data.message||'Não foi possível concluir.');return data;}
function localRoadmaps(){const roadmaps=[];for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i),match=/^fluxo:roadmap-portals:(\d+)$/.exec(key);if(!match)continue;try{const portals=normalize(JSON.parse(localStorage.getItem(key)));if(portals.length)roadmaps.push({id:Number(match[1]),portals});}catch{}}
 return roadmaps;}
function fromOldBrowser(){const roadmaps=localRoadmaps();
 const data={format:'fluxo-portals-v1',sourceOrigin:location.origin,roadmaps};const count=roadmaps.reduce((n,r)=>n+r.portals.length,0);status.textContent=count?count+' portais encontrados em '+roadmaps.length+' roadmap(s).':'Nenhum portal encontrado nesta origem ('+location.origin+'). Abra esta mesma página no Chrome e no endereço em que você usava o Fluxo.';
 if(!count){const other=document.createElement('a');other.href=location.protocol+'//'+(location.hostname==='localhost'?'127.0.0.1':'localhost')+':8787/recuperar-portais.html';other.textContent='Tentar o outro endereço local';actions.append(other);return;}
 showBackup(data);button('Continuar para minha conta',()=>{location.href='http://127.0.0.1:8788/recuperar-portais.html#'+encodeURIComponent(JSON.stringify(data));});button('Guardar cópia',()=>download(data),true);
}
async function inAccount(data){actions.replaceChildren();status.classList.remove('error');const session=await api('/auth/session');if(!session.user){status.textContent='Entre com sua conta na versão nova e volte aqui. Seus portais continuam preparados para recuperação.';const a=document.createElement('a');a.href='/';a.target='_blank';a.className='button';a.textContent='Entrar na conta';actions.append(a);button('Já entrei, continuar',()=>inAccount(data).catch(failure),true);return;}
 const combined=new Map();for(const m of [...data.roadmaps,...localRoadmaps()]){const existing=combined.get(m.id)||{id:m.id,portals:[]};const portals=new Map(existing.portals.map(p=>[p.id,p]));for(const p of normalize(m.portals))portals.set(p.id,p);combined.set(m.id,{id:m.id,portals:[...portals.values()]});}data={...data,roadmaps:[...combined.values()]};showBackup(data);
 const workspace=await api('/workspace');const own=new Map(workspace.roadmaps.map(m=>[m.id,m]));const maps=data.roadmaps.filter(m=>own.has(m.id)&&normalize(m.portals).length);const skipped=data.roadmaps.length-maps.length;const count=maps.reduce((n,m)=>n+normalize(m.portals).length,0);if(!count)throw new Error('Os portais não correspondem aos roadmaps desta conta. Confira se entrou na conta que recebeu a importação dos projetos.');
 status.textContent='Conta: '+session.user.name+'\n'+count+' portais preparados em '+maps.length+' roadmap(s).'+(skipped?'\n'+skipped+' roadmap(s) fora desta conta serão ignorados.':'')+'\nTextos, posições e conexões serão salvos no banco da sua conta.';
 const restore=button('Restaurar meus portais',async()=>{restore.disabled=true;try{const active=await api('/auth/session');if(active.user?.id!==session.user.id)throw new Error('A conta mudou. Atualize esta página antes de restaurar.');const fresh=await api('/workspace');const current=new Map(fresh.roadmaps.map(m=>[m.id,m]));let restored=0;for(const legacy of maps){const map=current.get(legacy.id);if(!map)throw new Error('Um roadmap mudou de conta. Atualize e tente novamente.');const nodeIds=new Set(map.nodes.map(n=>n.id));const existing=normalize(map.portals);const merged=new Map(existing.map(p=>[p.id,p]));for(const p of normalize(legacy.portals))if(!merged.has(p.id))merged.set(p.id,p);const portals=[...merged.values()].map(p=>({...p,sources:p.sources.filter(id=>nodeIds.has(id))}));await api('/roadmaps/'+map.id+'/portals','PUT',{version:map.portals_version||0,portals},active.csrf_token);restored+=normalize(legacy.portals).length;}status.textContent=restored+' portais recuperados e salvos na sua conta. Você já pode abrir o roadmap.';actions.replaceChildren();const open=document.createElement('a');open.href='/';open.className='button';open.textContent='Abrir Fluxo';actions.append(open);history.replaceState(null,'',location.pathname);}catch(e){failure(e);restore.disabled=false;}});button('Guardar cópia',()=>download(data),true);
}
async function start(){if(!loopback)throw new Error('Esta recuperação só funciona na instalação local.');if(location.port==='8787'){fromOldBrowser();return;}if(location.port!=='8788')throw new Error('Use esta recuperação nas versões locais 8787 e 8788.');if(!location.hash){status.textContent='Abra primeiro a versão antiga neste mesmo Chrome para encontrar seus portais.';const a=document.createElement('a');a.href='http://127.0.0.1:8787/recuperar-portais.html';a.className='button';a.textContent='Encontrar meus portais antigos';actions.append(a);return;}const raw=decodeURIComponent(location.hash.slice(1));if(raw.length>2000000)throw new Error('A cópia excede o limite permitido.');const data=JSON.parse(raw);if(data.format!=='fluxo-portals-v1'||!Array.isArray(data.roadmaps)||data.roadmaps.some(m=>!Number.isInteger(m.id)||m.id<1||!Array.isArray(m.portals)))throw new Error('A cópia de recuperação é inválida.');showBackup(data);await inAccount(data);}
start().catch(failure);
</script></html>
